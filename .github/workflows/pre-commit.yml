# Runs the hooks defined in .pre-commit-config.yaml in CI, mirroring the
# "Run pre-commit checks" step of https://github.com/DoubleML/doubleml-for-py
name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 1,3,5"
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-22.04

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # pre-commit's R-language hooks (roxygenize, lintr, pkgdown, ...) each
      # bootstrap their own isolated renv library via `additional_dependencies:`
      # in .pre-commit-config.yaml, but that install step is currently broken
      # (silently installs nothing) with this pre-commit/pre-commit-uv version.
      # Disabling renv's sandbox lets those hook environments fall back to
      # this job's regular R library instead, which setup-r-dependencies (via
      # DESCRIPTION) and the explicit installs below already populate.
      RENV_CONFIG_SANDBOX_ENABLED: false

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Install dev tools used only by pre-commit hooks
        run: |
          install.packages(c("pkgdown", "remotes", "styler", "roxygen2", "lintr"))
          remotes::install_local(".", force = TRUE)
        shell: Rscript {0}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure
