# Runs the hooks defined in .pre-commit-config.yaml in CI, mirroring the
# "Run pre-commit checks" step of https://github.com/DoubleML/doubleml-for-py
name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 1,3,5"
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-22.04

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        # not used by the hooks themselves (see the patch step below), but
        # this also installs system libraries (e.g. for ragg/textshaping/
        # systemfonts, pulled in transitively by pkgdown) that R package
        # compilation on the Linux runner needs.

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Bootstrap pre-commit hook environments
        run: pre-commit install-hooks

      - name: Patch pre-commit R hook environments
        # pre-commit's R-language hooks (roxygenize, lintr) each bootstrap
        # their own isolated renv library from `additional_dependencies:` in
        # .pre-commit-config.yaml, but that install step is flaky (silently
        # installs nothing) with the current pre-commit/pre-commit-uv
        # combination - reproduced locally as non-deterministic across runs,
        # not tied to any particular hook. Re-installing into every hook's
        # own renv project explicitly - activated the same way pre-commit
        # itself does, via R_PROFILE_USER pointing at that project's
        # activate.R - works around it. (renv::install(..., project = X)
        # does NOT work for this: it silently installs into whichever
        # project is already active rather than X.)
        run: |
          cat > /tmp/patch_deps.R <<'EOF'
          pkgs <- c(
            "R6", "data.table", "checkmate", "mlr3", "mlr3tuning", "mvtnorm",
            "clusterGeneration", "readstata13", "mlr3learners", "mlr3misc",
            "mlr3pipelines", "testthat", "patrick", "paradox", "dplyr", "glmnet",
            "lgr", "ranger", "sandwich", "AER", "rpart", "bbotk", "pkgdown"
          )
          tryCatch(
            renv::install(pkgs, prompt = FALSE),
            error = function(e) cat("pkg install error:", conditionMessage(e), "\n")
          )
          tryCatch(
            renv::install(Sys.getenv("GITHUB_WORKSPACE"), prompt = FALSE),
            error = function(e) cat("DoubleML install error:", conditionMessage(e), "\n")
          )
          EOF
          for envdir in "$HOME/.cache/pre-commit"/repo*/renv-default; do
            [ -d "$envdir" ] || continue
            echo "Patching $envdir"
            R_PROFILE_USER="$envdir/activate.R" RENV_PROJECT= Rscript --no-save --no-restore --no-site-file --no-environ /tmp/patch_deps.R
          done

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure
